# 一键起 Neo4j + 后端 + 前端（对应开发文档 12 章 / 13.2 工程项）
#
#   docker compose up -d
#   docker compose exec backend python -m backend.app.kg.loader --reset   # 首次导入图谱
#   open http://localhost:5173
#
# 说明
#   * 代码以卷挂载，改完不用重建镜像；后端容器首次启动会 pip install -e .（约 1~2 分钟）
#   * Neo4j 用 community 版即可：本项目只用只读 Cypher，不依赖企业版特性
#   * 生产部署不应这样挂载源码，这里是为了「评审查代码 + 现场改一行就能生效」

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: zhiwei-neo4j
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-zhiwei-local}"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # 导入器要连库，必须等 Bolt 真的通了再起后端
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    image: python:3.11-slim
    container_name: zhiwei-backend
    working_dir: /app
    volumes:
      - .:/app
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-zhiwei-local}"
      NEO4J_DATABASE: neo4j
      KG_BACKEND: "${KG_BACKEND:-neo4j}"
      KG_READONLY: "true"
      CORS_ORIGINS: "http://localhost:5173"
    command: >
      bash -lc "pip install --no-cache-dir -e '.[dev]' &&
                uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-slim
    container_name: zhiwei-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_API_BASE: http://localhost:8000
    command: bash -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  frontend_modules:
