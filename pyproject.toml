[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiwei-copilot"
version = "0.1.0"
description = "智维 Copilot：科沃斯 DEEBOT T 系列售后知识图谱与故障排查 Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "neo4j>=5.23",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    # 文档摄取：pdfplumber 负责表格结构，pypdf 用于快速全文与页面校验
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    # 官网 FAQ 抓取（backend/tools/fetch_faq.py）
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
