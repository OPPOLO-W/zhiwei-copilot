# -----------------------------------------------------------------------------
# 全局质量门槛（对应文档 1.4 成功标准；课程最低 60/120）
# -----------------------------------------------------------------------------
qualityGates:
  minEntities: 150
  minRelations: 300
  minEntitiesCourse: 60
  minRelationsCourse: 120
  maxSchemaViolations: 0
  minEvidenceCoverage: 1.0

# -----------------------------------------------------------------------------
# 能力问题（CQ）：本体是否「够用」的验收口径
#   query 指向实际能回答它的入口（API 路由 / 查询函数 / 评测题号），
#   docs/ontology.md 由本段生成 CQ 表，避免文档与实现对不上。
# -----------------------------------------------------------------------------
competencyQuestions:
  - id: CQ1
    question: T20 PRO 报 E11，最可能是什么部件/根因？
    path: ErrorCode → Symptom → Fault → Component → Cause
    query: POST /api/query（mode=rule）
  - id: CQ2
    question: 先清理还是直接换轮组？
    path: Cause → Check → Solution
    query: 证明树中 CONFIRMED_BY / RESOLVED_BY 两条分支
  - id: CQ3
    question: 养宠家庭反复报 E13，换边刷能解决吗？
    path: UsageEnvironment → Symptom → Cause → Consumable
    query: 规则 R09（耗材优先清理）+ 环境事实 home_environment
  - id: CQ4
    question: 10010 是硬件故障还是网络问题？
    path: ErrorCode → FaultCategory → Cause → Solution
    query: 规则 R20（network_first）+ Agent verify 交叉核对
  - id: CQ5
    question: 基站不上水，查水箱、水泵还是管路？
    path: Component → Fault → Check
    query: 规则 R21（water_check_order）
  - id: CQ6
    question: E41 电池异常，什么时候建议换电池？
    path: ErrorCode → Fault → Cause → Solution → SparePart
    query: 规则 R14（safety_stop）+ R08（兼容性否决）
  - id: CQ7
    question: 同一错误码在不同型号上含义一样吗？
    path: ErrorCode → ProductModel
    query: GET /api/graph/code/{code}；当前语料仅含单型号，返回覆盖清单
  - id: CQ8
    question: 哪些耗材与 T20 PRO 兼容？
    path: Consumable → COMPATIBLE_WITH → ProductModel
    query: Agent 工具 check_compatibility
  - id: CQ9
    question: 同一设备 30 天重复报修，应该升级还是换机？
    path: Ticket → Symptom → 重复计数 → Escalation
    query: 规则 R12（chronic_issue）+ 事实层重复计数聚合
  - id: CQ10
    question: 这个建议对应哪份官方文档/FAQ？
    path: Solution → Document → Evidence
    query: 证据面板 E* → docId → 原文定位
