# =============================================================================
# 02 故障知识（T20 PRO 单机型 ABox 种子）
# -----------------------------------------------------------------------------
# 诊断链路：ErrorCode -> Symptom -> Fault -> Cause -> Check -> Solution
# 所有 cf（置信度）是**启发式分数**，用于排序与阈值，不是校准概率。
#
# 证据分级（详见本文件 evidence 段）：
#   * documents 已全部对齐 data/raw/docs.jsonl 的真实 doc_id（1 本手册 + 58 篇 FAQ），
#     不再使用 DOC:T30-MANUAL 等语料中不存在的文档。
#   * 错误码层（E11/10010 等）在手册中查不到对应编码，属厂商公开提示码惯例，
#     统一挂 SYN:ASSUMED-CODES，不建 DOCUMENTED_IN 边。
#   * 根因层（causes）与方案优先级（precedence）属工程先验，语料无原文，标 assumed。
#   * 其余层为对语料的改写摘要（paraphrase），逐字核对后应升为 verbatim。
# =============================================================================

sources:
  default: DOC:T20PRO-MANUAL
  codes: SYN:ASSUMED-CODES
  symptom: DOC:T20PRO-MANUAL
  fault: DOC:T20PRO-MANUAL
  cause: SYN:ASSUMED-CAUSES
  check: DOC:T20PRO-MANUAL
  solution: DOC:T20PRO-MANUAL
  precedence: SYN:ASSUMED-CAUSES
  firmware: DOC:T20PRO-MANUAL

evidence:
  codes: assumed
  symptom: paraphrase
  fault: paraphrase
  cause: assumed
  check: paraphrase
  solution: paraphrase
  precedence: assumed
  firmware: assumed

categories:
  - {code: HARDWARE, name: 硬件故障, selfServiceable: false, note: 部件或电机类故障，通常需备件}
  - {code: CONSUMABLE, name: 耗材相关, selfServiceable: true, note: 耗材磨损、堵塞、未安装}
  - {code: NETWORK, name: 网络与连接, selfServiceable: true, note: 配网、Wi-Fi、APP 与固件}
  - {code: OPERATION, name: 用户操作, selfServiceable: true, note: 未按说明安装或设置}
  - {code: SAFETY, name: 安全风险, selfServiceable: false, note: 电池、进水、过热等，必须停止使用}

environments:
  - {code: PET, name: 养宠家庭, note: 宠物毛发与宠物粪便显著提高缠绕与异味风险}
  - {code: LONG-HAIR, name: 长发家庭, note: 长发易缠绕主刷与轮轴}
  - {code: CARPET, name: 地毯环境, note: 地毯流苏与绒毛影响越障与吸力}
  - {code: DUPLEX, name: 复式/多层, note: 多层地图切换，易出现地图丢失}
  - {code: LARGE-HOME, name: 大户型, note: 面积大，续航与回充压力更高}
  - {code: BALCONY, name: 阳台/推拉门, note: 门槛与轨道影响越障}

agents:
  - {code: OFFICIAL-400, name: 官方售后 400 热线, type: official, slaHours: 24}
  - {code: OFFICIAL-STORE-SH, name: 上海官方服务中心, type: official, city: 上海, slaHours: 48}
  - {code: OFFICIAL-STORE-BJ, name: 北京官方服务中心, type: official, city: 北京, slaHours: 48}
  - {code: ONLINE-SUPPORT, name: 在线客服, type: official, slaHours: 4}
  - {code: THIRD-PARTY-REPAIR, name: 第三方维修点, type: third_party, slaHours: 72}
  - {code: SPARE-PARTS-CENTER, name: 官方备件商城, type: official, slaHours: 72}

