  - {code: MOTOR-FAULT, name: 驱动电机故障, category: hardware, userFixable: false, confirm: [CHECK-MOTOR-CURRENT], resolvedBy: [{solution: ESCALATE-SERVICE, cf: 0.60}], note: 电机绕组或驱动电路故障需售后检测}
  - {code: HAIR-WRAP-SIDE-BRUSH, name: 边刷刷毛缠绕, category: environment, userFixable: true, confirm: [INSPECT-SIDE-BRUSH], resolvedBy: [{solution: CLEAN-SIDE-BRUSH, cf: 0.80}], note: 边刷轴心易缠绕长发}
  - {code: BRUSH-DEFORMED, name: 刷毛变形, category: consumable, userFixable: true, confirm: [INSPECT-SIDE-BRUSH], resolvedBy: [{solution: REPLACE-SIDE-BRUSH, cf: 0.75}], note: 刷毛外翻变形后清扫与转动异常}
  - {code: HAIR-WRAP-MAIN-BRUSH, name: 主刷毛发缠绕, category: environment, userFixable: true, confirm: [INSPECT-MAIN-BRUSH], resolvedBy: [{solution: CLEAN-MAIN-BRUSH, cf: 0.85}], note: 主刷两端轴承处最易缠绕长发}
  - {code: DEBRIS-JAM, name: 异物卡入主刷, category: environment, userFixable: true, confirm: [INSPECT-MAIN-BRUSH], resolvedBy: [{solution: CLEAN-MAIN-BRUSH, cf: 0.70}], note: 纸团、塑料袋等异物卡住主刷}
  - {code: FAN-DEBRIS, name: 风机叶轮积尘, category: environment, userFixable: false, confirm: [CHECK-AIRFLOW], resolvedBy: [{solution: CLEAN-FAN, cf: 0.70}], note: 长期使用后叶轮积尘导致风量下降}
  - {code: FILTER-CLOG-CAUSE, name: 滤网积尘堵塞, category: consumable, userFixable: true, confirm: [CHECK-FILTER], resolvedBy: [{solution: CLEAN-FILTER, cf: 0.60}, {solution: REPLACE-FILTER, cf: 0.80}], note: 滤网可用清水冲洗晾干，超周期需更换}
  - {code: BATTERY-SWELL, name: 电芯鼓包或漏液, category: hardware, userFixable: false, confirm: [SAFETY-VISUAL-CHECK], resolvedBy: [{solution: SAFETY-STOP, cf: 0.95}, {solution: ESCALATE-SERVICE, cf: 0.90}], note: 鼓包、漏液必须停用，禁止自行拆解}
  - {code: OVERHEAT-VENT, name: 散热不良, category: environment, userFixable: true, confirm: [CHECK-BATTERY-TEMP], resolvedBy: [{solution: SAFETY-STOP, cf: 0.80}, {solution: MOVE-TO-VENTILATED, cf: 0.70}], note: 充电座周围堆物或高温环境导致散热不良}
  - {code: BATTERY-AGING-CAUSE, name: 电池循环老化, category: hardware, userFixable: false, confirm: [CHECK-BATTERY-RUNTIME], resolvedBy: [{solution: REPLACE-BATTERY, cf: 0.75}], note: 循环次数增加后容量衰减属正常老化}
  - {code: CONTACT-DIRTY, name: 充电触点氧化, category: environment, userFixable: true, confirm: [CHECK-CONTACT], resolvedBy: [{solution: CLEAN-CONTACT, cf: 0.85}, {solution: REPLACE-CHARGE-CONTACT, cf: 0.55}], note: 潮湿环境易使触点氧化发黑}
  - {code: SENSOR-DIRTY, name: 下视传感器脏污, category: environment, userFixable: true, confirm: [WIPE-CLIFF-SENSOR], resolvedBy: [{solution: CLEAN-CLIFF-SENSOR, cf: 0.85}], note: 传感器镜面灰尘会导致误判悬崖}
  - {code: BUMPER-DEBRIS, name: 碰撞板缝隙异物, category: environment, userFixable: true, confirm: [PRESS-BUMPER], resolvedBy: [{solution: CLEAN-BUMPER, cf: 0.80}], note: 缝隙内毛发影响碰撞板回弹}
  - {code: LDS-DIRTY, name: 雷达视窗脏污, category: environment, userFixable: true, confirm: [WIPE-LDS], resolvedBy: [{solution: CLEAN-LDS, cf: 0.70}], note: 雷达视窗灰尘影响测距}
  - {code: LDS-HARDWARE, name: 雷达电机或皮带故障, category: hardware, userFixable: false, confirm: [LISTEN-LDS], resolvedBy: [{solution: REPLACE-LDS, cf: 0.60}, {solution: ESCALATE-SERVICE, cf: 0.70}], note: 雷达不转且无异物时多为电机或皮带故障}
  - {code: DUST-BOX-NOT-SEATED, name: 尘盒未卡到位, category: operation, userFixable: true, confirm: [CHECK-DUST-BOX], resolvedBy: [{solution: RESEAT-DUST-BOX, cf: 0.90}], note: 尘盒未推到底会触发 E31}
  - {code: DUST-BAG-FULL-CAUSE, name: 尘袋积满, category: consumable, userFixable: true, confirm: [CHECK-DUST-BAG], resolvedBy: [{solution: REPLACE-DUST-BAG, cf: 0.90}], note: 尘袋满后必须整体更换}
  - {code: PUMP-AIRLOCK, name: 水泵气阻, category: operation, userFixable: true, confirm: [PRIME-WATER-PATH], resolvedBy: [{solution: PRIME-PUMP, cf: 0.80}], note: 新装或长期停用后管路进气形成气阻}
  - {code: PUMP-CLOG, name: 水路水垢堵塞, category: environment, userFixable: true, confirm: [CHECK-WATER-FLOW], resolvedBy: [{solution: DESCALE-WATER-PATH, cf: 0.75}], note: 硬水地区易在管路与水泵处结垢}
  - {code: PUMP-BROKEN, name: 水泵损坏, category: hardware, userFixable: false, confirm: [CHECK-WATER-FLOW], resolvedBy: [{solution: REPLACE-PUMP, cf: 0.80}], note: 排气与除垢无效时考虑泵体损坏}
  - {code: TANK-NOT-SEATED, name: 水箱未卡到位, category: operation, userFixable: true, confirm: [CHECK-WATER-TANK], resolvedBy: [{solution: RESEAT-WATER-TANK, cf: 0.85}], note: 水箱未卡到位会触发 E33}
  - {code: TANK-SEAL-WORN, name: 水箱密封圈老化, category: hardware, userFixable: true, confirm: [CHECK-WATER-LEAK], resolvedBy: [{solution: REPLACE-TANK-SEAL, cf: 0.70}], note: 密封圈老化导致渗水}
  - {code: SEWAGE-OVERFLOW, name: 污水箱未清空, category: operation, userFixable: true, confirm: [CHECK-SEWAGE-TANK], resolvedBy: [{solution: EMPTY-SEWAGE-TANK, cf: 0.90}], note: 污水箱满后继续工作会报警并产生异味}
  - {code: MOP-NOT-CLIPPED, name: 拖布支架未卡紧, category: operation, userFixable: true, confirm: [CHECK-MOP-PLATE], resolvedBy: [{solution: RESEAT-MOP-PLATE, cf: 0.90}], note: 支架未卡紧会导致识别失败与拖地偏移}
  - {code: WIFI-5G-BAND, name: 连接 5GHz 频段, category: operation, userFixable: true, confirm: [CHECK-WIFI-BAND], resolvedBy: [{solution: SWITCH-24G, cf: 0.85}], note: 设备仅支持 2.4GHz，5GHz 会导致配网失败}
  - {code: WIFI-PASSWORD, name: Wi-Fi 密码错误, category: operation, userFixable: true, confirm: [CHECK-WIFI-CREDENTIAL], resolvedBy: [{solution: RECONFIGURE-WIFI, cf: 0.80}], note: 密码含特殊字符或输入错误导致配网失败}
  - {code: ROUTER-ISOLATION, name: 路由器隔离或防蹭网, category: environment, userFixable: true, confirm: [CHECK-ROUTER-SETTINGS], resolvedBy: [{solution: ADJUST-ROUTER, cf: 0.70}], note: AP 隔离、MAC 过滤会阻止设备入网}
  - {code: FW-BUG, name: 固件缺陷, category: software, userFixable: true, confirm: [CHECK-FIRMWARE-NOTES], resolvedBy: [{solution: UPDATE-FIRMWARE, cf: 0.80}], note: 特定固件版本存在已知配网缺陷}
  - {code: ROUTER-DISTANCE, name: 路由器距离过远, category: environment, userFixable: true, confirm: [CHECK-WIFI-SIGNAL], resolvedBy: [{solution: MOVE-ROUTER, cf: 0.70}], note: 隔墙过多导致信号衰减}
  - {code: APP-VERSION-OLD, name: APP 版本过低, category: software, userFixable: true, confirm: [CHECK-APP-VERSION], resolvedBy: [{solution: UPDATE-APP, cf: 0.80}], note: 旧版 APP 在新系统上存在兼容问题}
  - {code: FW-NETWORK-INTERRUPT, name: 升级过程网络中断, category: software, userFixable: true, confirm: [CHECK-NETWORK-STABILITY], resolvedBy: [{solution: RETRY-UPGRADE, cf: 0.80}], note: 升级需稳定网络，中断会导致校验失败}
  - {code: MAP-CACHE-CORRUPT, name: 地图缓存损坏, category: software, userFixable: true, confirm: [], resolvedBy: [{solution: RESET-MAP, cf: 0.75}], note: 缓存损坏导致地图空白}

checks:
  - {code: SPIN-LEFT-WHEEL, name: 手动转动左轮, method: 关机后手动转动左轮，感受阻力并听是否有异响, riskLevel: low, durationMin: 2, detects: [LEFT-WHEEL-STUCK], note: 阻力明显或转不动说明存在缠绕或轴承问题}
  - {code: CHECK-WHEEL-BEARING, name: 检查轮组轴承间隙, method: 拆下轮组晃动轴心，检查是否有明显间隙, riskLevel: medium, durationMin: 5, detects: [LEFT-WHEEL-STUCK, RIGHT-WHEEL-STUCK], note: 轴承间隙过大需更换轮组}
  - {code: CHECK-MOTOR-CURRENT, name: 检测驱动电机电流, method: 售后用万用表测量电机电流是否超出标称范围, riskLevel: high, durationMin: 15, detects: [LEFT-WHEEL-STUCK, RIGHT-WHEEL-STUCK], note: 需专业人员操作，用户不可自行拆机}
  - {code: INSPECT-SIDE-BRUSH, name: 检查边刷, method: 翻转机身检查边刷刷毛是否缠绕、是否外翻变形, riskLevel: low, durationMin: 2, detects: [SIDE-BRUSH-JAM], note: 目视即可判断缠绕与变形}
  - {code: INSPECT-MAIN-BRUSH, name: 检查主刷, method: 取出主刷检查两端轴承处是否缠绕毛发、是否卡有异物, riskLevel: low, durationMin: 3, detects: [MAIN-BRUSH-JAM], note: 主刷两端最易缠绕}
  - {code: CHECK-AIRFLOW, name: 检查风道与吸力, method: 手掌贴近吸口感受吸力，检查风道是否有异物, riskLevel: low, durationMin: 3, detects: [FAN-BLOCKED], note: 吸力明显减弱说明风道或风机异常}
  - {code: CHECK-FILTER, name: 检查滤网, method: 取出滤网对着光观察透光性, riskLevel: low, durationMin: 2, detects: [FILTER-CLOG], note: 透光差说明滤网堵塞}
  - {code: SAFETY-VISUAL-CHECK, name: 电池外观安全检查, method: 观察电池是否有鼓包、变形、漏液或异味，禁止拆解, riskLevel: low, durationMin: 2, detects: [BATTERY-OVERHEAT], note: 出现任一现象立即停用}
  - {code: CHECK-BATTERY-TEMP, name: 感受电池区域温度, method: 充电 30 分钟后触摸机身底部电池区域温度, riskLevel: low, durationMin: 30, detects: [BATTERY-OVERHEAT], note: 明显烫手需停止充电}
  - {code: CHECK-BATTERY-RUNTIME, name: 测试满电续航, method: 满电后在标准模式记录清扫面积与耗电速度, riskLevel: low, durationMin: 60, detects: [BATTERY-AGING], note: 续航低于标称 60% 可判断老化}
  - {code: CHECK-CONTACT, name: 检查充电触点, method: 观察机身与基站触点是否发黑、有污渍或变形, riskLevel: low, durationMin: 2, detects: [CHARGE-CONTACT-FAULT], note: 触点发黑多为氧化}
  - {code: WIPE-CLIFF-SENSOR, name: 擦拭下视传感器, method: 用干布擦拭底部下视传感器镜面, riskLevel: low, durationMin: 2, detects: [CLIFF-SENSOR-FAULT], note: 擦拭后误停消失即可确认}
  - {code: PRESS-BUMPER, name: 手动按压碰撞板, method: 按压碰撞板左右两侧，检查回弹是否顺畅, riskLevel: low, durationMin: 2, detects: [BUMPER-STUCK], note: 回弹迟滞说明缝隙有异物}
  - {code: WIPE-LDS, name: 擦拭雷达视窗, method: 用干布擦拭顶部雷达视窗与侧面透光孔, riskLevel: low, durationMin: 2, detects: [LDS-FAILURE], note: 视窗脏污会导致测距漂移}
  - {code: LISTEN-LDS, name: 听雷达转动声, method: 开机后贴近雷达听是否持续转动、是否有异响, riskLevel: low, durationMin: 3, detects: [LDS-FAILURE], note: 完全不转或异响说明机械故障}
  - {code: CHECK-DUST-BOX, name: 检查尘盒安装, method: 取出尘盒重新推到底，听卡扣是否到位, riskLevel: low, durationMin: 1, detects: [DUST-BOX-MISSING], note: 未卡到位会持续报 E31}
  - {code: CHECK-DUST-BAG, name: 检查尘袋, method: 打开基站上盖检查尘袋是否装满或未安装, riskLevel: low, durationMin: 1, detects: [DUST-BAG-FULL], note: 尘袋不可清洗复用}
  - {code: PRIME-WATER-PATH, name: 水路排气, method: 取下清水箱重新安装，运行基站清洗程序排出空气, riskLevel: low, durationMin: 5, detects: [WATER-PUMP-FAULT], note: 排气后出水恢复说明为气阻}
  - {code: CHECK-WATER-FLOW, name: 检查水路出水, method: 触发基站清洗，观察出水是否连续、滤网是否堵塞, riskLevel: low, durationMin: 5, detects: [WATER-PUMP-FAULT, WATER-TANK-LEAK], note: 出水断续多为堵塞}
  - {code: CHECK-WATER-TANK, name: 检查清水箱安装, method: 取出清水箱检查水位并重新卡到位, riskLevel: low, durationMin: 1, detects: [WATER-TANK-EMPTY], note: 未卡到位会报 E33}
  - {code: CHECK-WATER-LEAK, name: 检查水箱密封, method: 装满水静置 10 分钟观察接缝是否渗水, riskLevel: low, durationMin: 10, detects: [WATER-TANK-LEAK], note: 接缝渗水说明密封圈老化}
  - {code: CHECK-SEWAGE-TANK, name: 检查污水箱, method: 取出污水箱查看水位与浮子是否卡住, riskLevel: low, durationMin: 2, detects: [SEWAGE-TANK-FULL], note: 浮子卡住会误报满水}
  - {code: CHECK-MOP-PLATE, name: 检查拖布支架卡扣, method: 重新安装拖布支架，确认两侧卡扣到位, riskLevel: low, durationMin: 2, detects: [MOP-PLATE-NOT-SEATED], note: 单侧未卡紧会导致识别失败}
  - {code: CHECK-WIFI-BAND, name: 检查 Wi-Fi 频段, method: 在路由器后台确认 2.4GHz 与 5GHz 是否同名同密码, riskLevel: low, durationMin: 5, detects: [WIFI-PAIR-FAIL], note: 双频合一常导致设备连到 5GHz}
  - {code: CHECK-WIFI-CREDENTIAL, name: 核对 Wi-Fi 密码, method: 用手机连接同一 2.4GHz 网络验证密码正确, riskLevel: low, durationMin: 3, detects: [WIFI-PAIR-FAIL], note: 特殊字符可能导致输入失败}
  - {code: CHECK-ROUTER-SETTINGS, name: 检查路由器隔离设置, method: 关闭 AP 隔离、MAC 过滤与防蹭网，确认未启用访客网络, riskLevel: low, durationMin: 10, detects: [WIFI-PAIR-FAIL, APP-BIND-FAIL], note: 隔离设置会阻止设备入网}
  - {code: CHECK-FIRMWARE-NOTES, name: 核对固件已知问题, method: 在 APP 中查看当前固件版本与更新说明, riskLevel: low, durationMin: 3, detects: [WIFI-PAIR-FAIL], note: 特定版本存在已知配网缺陷}
  - {code: CHECK-WIFI-SIGNAL, name: 检查 Wi-Fi 信号强度, method: 在设备位置用手机测速并查看信号格数, riskLevel: low, durationMin: 5, detects: [WIFI-SIGNAL-WEAK], note: 信号低于两格易离线}
  - {code: CHECK-APP-VERSION, name: 检查 APP 版本, method: 在应用商店确认是否为最新版本, riskLevel: low, durationMin: 2, detects: [APP-BIND-FAIL, MAP-LOAD-FAIL], note: 旧版 APP 存在兼容问题}
  - {code: CHECK-NETWORK-STABILITY, name: 检查网络稳定性, method: 升级前用手机在同一网络下进行持续测速, riskLevel: low, durationMin: 5, detects: [FIRMWARE-UPGRADE-FAIL], note: 丢包会导致升级校验失败}

solutions:
  - {code: CLEAN-WHEEL, name: 清理轮组缠绕物, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 10, excludes: [HAIR-WRAP-WHEEL], docs: [DOC:FAQ-15922], note: 关机后剪断并清除轮轴毛发，再手动转动确认顺畅}
  - {code: REPLACE-WHEEL, name: 更换轮组总成, type: replace, riskLevel: medium, selfServiceable: true, estimatedMin: 20, parts: [LEFT-WHEEL-ASSY], excludes: [BEARING-WEAR, HAIR-WRAP-WHEEL], docs: [DOC:T20PRO-MANUAL], note: 轴承磨损或轮组变形时更换对应侧轮组}
  - {code: ESCALATE-SERVICE, name: 转官方售后检测, type: escalate, riskLevel: low, selfServiceable: true, estimatedMin: 5, docs: [DOC:T20PRO-MANUAL], note: 涉及电机、主板、电池的故障应转官方售后}
  - {code: CLEAN-SIDE-BRUSH, name: 清理边刷, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 5, excludes: [HAIR-WRAP-SIDE-BRUSH], docs: [DOC:FAQ-15805], note: 取下边刷清除缠绕毛发}
  - {code: REPLACE-SIDE-BRUSH, name: 更换边刷, type: replace, riskLevel: low, selfServiceable: true, estimatedMin: 5, consumes: [SIDE-BRUSH], docs: [DOC:FAQ-15805], note: 刷毛变形或断裂时成对更换}
  - {code: CLEAN-MAIN-BRUSH, name: 清理主刷, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 10, docs: [DOC:FAQ-15807], note: 用清理刀割断缠绕毛发并取出异物}
  - {code: REPLACE-MAIN-BRUSH, name: 更换主刷, type: replace, riskLevel: low, selfServiceable: true, estimatedMin: 5, consumes: [MAIN-BRUSH], docs: [DOC:FAQ-15807], note: 胶条磨损或变形时更换}
  - {code: CLEAN-FAN, name: 清理风机与风道, type: clean, riskLevel: medium, selfServiceable: false, estimatedMin: 15, docs: [], note: 风机位于机身内部，建议售后清理}
  - {code: CLEAN-FILTER, name: 清洗滤网, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 10, docs: [DOC:T20PRO-MANUAL], note: 清水冲洗后需完全晾干再装回}
  - {code: REPLACE-FILTER, name: 更换滤网, type: replace, riskLevel: low, selfServiceable: true, estimatedMin: 3, consumes: [FILTER], excludes: [FILTER-CLOG-CAUSE], docs: [DOC:T20PRO-MANUAL], note: 每 3 个月或无法洗净时更换}
  - {code: SAFETY-STOP, name: 立即停用并断开充电, type: escalate, riskLevel: low, selfServiceable: true, estimatedMin: 1, docs: [DOC:T20PRO-MANUAL], note: 停止使用与充电，远离可燃物，联系官方售后}
  - {code: MOVE-TO-VENTILATED, name: 移至通风处降温, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 30, docs: [], note: 移至阴凉通风处自然降温，禁止继续充电}
  - {code: REPLACE-BATTERY, name: 更换电池组, type: replace, riskLevel: high, selfServiceable: false, estimatedMin: 60, parts: [BATTERY-PACK], docs: [], note: 电池为不可自行拆解部件，必须由官方售后更换}
  - {code: CLEAN-CONTACT, name: 清洁充电触点, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 5, exhausts: true, docs: [DOC:T20PRO-MANUAL], note: 用干布或橡皮擦清洁触点氧化层，禁止用湿布}
  - {code: CLEAN-CLIFF-SENSOR, name: 清洁下视传感器, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 3, docs: [DOC:T20PRO-MANUAL], note: 干布擦拭底部传感器镜面}
  - {code: CLEAN-BUMPER, name: 清理碰撞板缝隙, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 5, docs: [DOC:T20PRO-MANUAL], note: 清除碰撞板缝隙毛发使其回弹顺畅}
  - {code: CLEAN-LDS, name: 清洁雷达视窗, type: clean, riskLevel: low, selfServiceable: true, estimatedMin: 3, excludes: [LDS-DIRTY], docs: [DOC:T20PRO-MANUAL], note: 干布擦拭雷达视窗，禁止使用酒精}
  - {code: REPLACE-LDS, name: 更换激光雷达总成, type: replace, riskLevel: high, selfServiceable: false, estimatedMin: 60, parts: [LDS-ASSY], docs: [], note: 雷达电机或皮带故障需售后更换总成}
  - {code: RESEAT-DUST-BOX, name: 重新安装尘盒, type: reset, riskLevel: low, selfServiceable: true, estimatedMin: 1, docs: [DOC:FAQ-15806], note: 尘盒推到底直到卡扣到位}
