# 处置步骤先后顺序（R19 使用）
precedence:
  - {before: RESEAT-WATER-TANK, after: PRIME-PUMP, note: 先确认水箱安装与水位，再排气}
  - {before: PRIME-PUMP, after: DESCALE-WATER-PATH, note: 排气无效再除垢}
  - {before: DESCALE-WATER-PATH, after: REPLACE-PUMP, note: 除垢无效再换泵}
  - {before: CLEAN-WHEEL, after: REPLACE-WHEEL, note: 先清理再考虑换轮组}
  - {before: CLEAN-FILTER, after: REPLACE-FILTER, note: 先清洗再更换}
  - {before: CLEAN-CONTACT, after: REPLACE-CHARGE-CONTACT, note: 先清洁触点再考虑更换}
  - {before: CLEAN-LDS, after: REPLACE-LDS, note: 先清洁视窗再换总成}
  - {before: SWITCH-24G, after: RECONFIGURE-WIFI, note: 先确认频段再重新配网}
  - {before: SAFETY-STOP, after: ESCALATE-SERVICE, note: 先停用再联系售后}
  - {before: SAFETY-STOP, after: MOVE-TO-VENTILATED, note: 先停用再降温}

