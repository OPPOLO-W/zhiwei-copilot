  - {code: FAN-ASSY, name: 风机总成, sku: SP-FAN-T20, category: cleaning, userReplaceable: false, compatible: all, note: 风机总成因异物损坏时更换}
  - {code: LDS-ASSY, name: 激光扫描模块总成, sku: SP-LDS-T20, category: navigation, userReplaceable: false, compatible: all, note: 雷达电机或皮带故障需更换总成}
  - {code: MAINBOARD-ASSY, name: 主板总成, sku: SP-MB-T20, category: control, userReplaceable: false, compatible: all, note: 主板故障需售后检测后更换}
  - {code: BASE-STATION-BOARD, name: 基站控制板, sku: SP-BSB-T20, category: station, userReplaceable: false, compatible: all, note: 基站控制板故障影响充电与集尘}
